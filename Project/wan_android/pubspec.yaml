name: wan_android
description: "WanShop：面向 iOS 开发者的 Flutter 电商教学项目。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  json_annotation: ^4.12.0
  dio: ^5.9.2
  cached_network_image: ^3.4.1
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  mocktail: ^1.0.5

flutter:

  uses-material-design: true

  generate: true
