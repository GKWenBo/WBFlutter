name: riverpod_lab
description: "Riverpod 3.x 教学工程：从 Notifier 到异步、依赖注入与测试。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（Riverpod 3.x 运行时 + codegen 注解）
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # codegen：新增/修改 @riverpod 后执行
  #   dart run build_runner build
  # 开发时可常驻监听：dart run build_runner watch
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
